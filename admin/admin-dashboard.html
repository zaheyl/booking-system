<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal &mdash; Companies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">Admin <span>Portal</span></div>
  <button class="logout-btn" id="logoutBtn">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Log out
  </button>
</div>

<div class="page">
  <div class="page-toolbar">
    <div>
      <h2>Companies</h2>
      <p>Every company on the platform &mdash; add, edit, or remove one below.</p>
    </div>
    <button class="add-company-btn" id="addCompanyBtn" type="button">+ Add company</button>
  </div>

  <div class="company-grid" id="companyGrid"></div>
  <p class="empty-note" id="emptyNote" hidden>No companies yet. Add the first one above.</p>
</div>

<!-- ===================== ADD/EDIT COMPANY MODAL ===================== -->
<div class="modal-overlay" id="companyModal" hidden>
  <div class="modal-box">
    <button class="modal-close" id="companyModalClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h3 id="companyModalTitle">Add a company</h3>

    <form class="company-form" id="companyForm">
      <label for="fCompanyName">Company name</label>
      <input type="text" id="fCompanyName" required>

      <label for="fEmail">Login email</label>
      <input type="email" id="fEmail" required>

      <label for="fPassword">Password <small id="passwordHint">(at least 6 characters)</small></label>
      <input type="password" id="fPassword" autocomplete="new-password">

      <div class="field-pair">
        <div>
          <label for="fPhone">Phone</label>
          <input type="text" id="fPhone">
        </div>
        <div>
          <label for="fWhatsapp">WhatsApp <small>(digits only)</small></label>
          <input type="text" id="fWhatsapp">
        </div>
      </div>

      <label for="fAddress">Address</label>
      <input type="text" id="fAddress">

      <div class="field-pair">
        <div>
          <label for="fPricingMode">Pricing mode</label>
          <select id="fPricingMode">
            <option value="per_day">Per day</option>
            <option value="per_night">Per night</option>
          </select>
        </div>
        <div>
          <label for="fSchedulingMode">Scheduling mode</label>
          <select id="fSchedulingMode">
            <option value="day">Day setting</option>
            <option value="hour">Hours setting</option>
          </select>
        </div>
      </div>

      <label for="fCurrency">Currency symbol</label>
      <input type="text" id="fCurrency" placeholder="$, RM, SGD&hellip;" maxlength="5">

      <div class="modal-actions">
        <button type="button" class="modal-btn-secondary" id="companyModalCancel">Cancel</button>
        <button type="submit" class="modal-btn-primary" id="companyModalSave">Add company</button>
      </div>

      <div id="companyFormMessage"></div>
    </form>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
