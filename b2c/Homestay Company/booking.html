<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm your booking &mdash; Barber Retreat and Resort Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="booking-page">

  <header class="site-head">
    <div class="wordmark">
      <span class="wordmark-name">Barber Retreat &amp; Resort Co.</span>
    </div>
  </header>

  <div class="detail-container" id="detailContainer">
    <p class="list-note">Loading&hellip;</p>
  </div>

  <!-- QR payment popup -->
  <div class="qr-modal-overlay hidden" id="qrModal">
    <div class="qr-modal">
      <h3>Scan to pay</h3>
      <img id="qrImage" alt="Payment QR code">
      <p class="qr-note">
        Please pay through QR payment. Upon payment received, you will be
        notified through email within 24 hours.
      </p>
      <div class="qr-modal-buttons">
        <button class="btn-cancel" id="qrCloseBtn">Close</button>
        <button class="btn-confirm" id="qrContactBtn">Contact us</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="booking.js"></script>
</body>
</html>
